name: Build APK with bundled Cilla Mini

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bundled-cilla-mini

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes Android command-line tools.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "::error::Android SDK command-line tools not installed"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android SDK 36
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Download gated model into APK assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Missing HF_TOKEN secret"; exit 1; }
          python3 .github/scripts/bundle_cilla.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle Phonon WASM runtime offline
        run: |
          mkdir -p app/src/main/assets/phonon-runtime
          npm pack phonon-tts@latest --pack-destination /tmp
          tar -xzf /tmp/phonon-tts-*.tgz -C app/src/main/assets/phonon-runtime --strip-components=1
          test -s app/src/main/assets/phonon-runtime/index.js
          test -s app/src/main/assets/phonon-runtime/worker.js
          test -s app/src/main/assets/phonon-runtime/wasm/phonon_tts_bg.wasm
      - name: Generate local debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cilla-mini-offline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
