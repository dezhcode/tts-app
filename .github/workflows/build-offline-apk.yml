name: Build APK with bundled Cilla Mini

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bundled-cilla-mini

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes Android command-line tools.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "::error::Android SDK command-line tools not installed"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android SDK 36
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Download gated model into APK assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Missing HF_TOKEN secret"; exit 1; }
          python3 -m py_compile .github/scripts/bundle_cilla.py
          python3 .github/scripts/bundle_cilla.py
          for file in config.json tokenizer.json model.safetensors voices/parisa.safetensors voices/voice1.safetensors voices/voice2.safetensors; do
            test -s "app/src/main/assets/cilla-mini/phonon/model/$file" || { echo "::error::Missing bundled model file: $file"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle Phonon WASM runtime offline
        run: |
          mkdir -p app/src/main/assets/phonon-runtime
          npm pack phonon-tts@latest --pack-destination /tmp
          tar -xzf /tmp/phonon-tts-*.tgz -C app/src/main/assets/phonon-runtime --strip-components=1
          test -s app/src/main/assets/phonon-runtime/index.js
          test -s app/src/main/assets/phonon-runtime/worker.js
          test -s app/src/main/assets/phonon-runtime/wasm/phonon_tts_bg.wasm
      - name: Restore permanent release keystore
        env:
          AVINA_KEYSTORE_BASE64: ${{ secrets.AVINA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AVINA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AVINA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AVINA_KEYSTORE_BASE64" || { echo "::error::Missing AVINA_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing AVINA_STORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing AVINA_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$AVINA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avina-release.jks"
          test -s "$RUNNER_TEMP/avina-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/avina-release.jks" >> "$GITHUB_ENV"
      - name: Build release-signed APK
        env:
          STORE_PASSWORD: ${{ secrets.AVINA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AVINA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Verify signature and prepare APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -n "$APK" || { echo "::error::Release APK not found"; exit 1; }
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" Avina-0.1.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avina-0.1.0
          path: Avina-0.1.0.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/feature/bundled-cilla-mini'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.0"
          NOTES="Avina 0.1.0 Android APK. Signed with the permanent Avina release keystore."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Avina-0.1.0.apk --clobber
            gh release edit "$TAG" --title "Avina 0.1.0" --notes "$NOTES" --latest
          else
            gh release create "$TAG" Avina-0.1.0.apk --target "$GITHUB_SHA" --title "Avina 0.1.0" --notes "$NOTES" --latest
          fi
